name: Deploy to Google Cloud Functions

on:
  push:
    branches:
      - master
      - main

env:
  REGION: europe-west1
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Telegram Bot Function
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          USE_BIGQUERY: ${{ secrets.USE_BIGQUERY }}
          BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
          BIGQUERY_TABLE: ${{ secrets.BIGQUERY_TABLE }}
          COACH_MEDIA_BUCKET: ${{ secrets.COACH_MEDIA_BUCKET }}
          CLOUD_TASKS_QUEUE: ${{ secrets.CLOUD_TASKS_QUEUE }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
        run: |
          # Получаем project number для Cloud Tasks service account
          PROJECT_NUMBER=$(gcloud projects describe ${PROJECT_ID} --format='value(projectNumber)')
          ENV_VARS="BOT_TOKEN=${BOT_TOKEN},GCS_BUCKET=${PROJECT_ID}-slots,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GCP_PROJECT=${PROJECT_ID},GCP_PROJECT_NUMBER=${PROJECT_NUMBER}"
          if [ -n "${COACH_MEDIA_BUCKET}" ]; then
            ENV_VARS="${ENV_VARS},COACH_MEDIA_BUCKET=${COACH_MEDIA_BUCKET}"
          fi
          # Формируем URL функции uploadCoachMedia (будет установлен после её деплоя)
          MEDIA_UPLOAD_FUNCTION_URL="https://${{ env.REGION }}-${PROJECT_ID}.cloudfunctions.net/uploadCoachMedia"
          ENV_VARS="${ENV_VARS},MEDIA_UPLOAD_FUNCTION_URL=${MEDIA_UPLOAD_FUNCTION_URL}"
          # Устанавливаем переменные для Cloud Tasks (если заданы)
          if [ -n "${CLOUD_TASKS_QUEUE}" ]; then
            ENV_VARS="${ENV_VARS},CLOUD_TASKS_QUEUE=${CLOUD_TASKS_QUEUE}"
          fi
          if [ -n "${USE_BIGQUERY}" ]; then
            ENV_VARS="${ENV_VARS},USE_BIGQUERY=${USE_BIGQUERY}"
          fi
          if [ -n "${BIGQUERY_DATASET}" ]; then
            ENV_VARS="${ENV_VARS},BIGQUERY_DATASET=${BIGQUERY_DATASET}"
          fi
          if [ -n "${BIGQUERY_TABLE}" ]; then
            ENV_VARS="${ENV_VARS},BIGQUERY_TABLE=${BIGQUERY_TABLE}"
          fi
          if [ -n "${YOOKASSA_SHOP_ID}" ]; then
            ENV_VARS="${ENV_VARS},YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}"
          fi
          if [ -n "${YOOKASSA_SECRET_KEY}" ]; then
            ENV_VARS="${ENV_VARS},YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}"
          fi
          gcloud functions deploy playTodayBot \
            --gen2 \
            --runtime=nodejs20 \
            --trigger-http \
            --allow-unauthenticated \
            --entry-point=telegramWebhook \
            --set-env-vars "${ENV_VARS}" \
            --set-build-env-vars "GOOGLE_NODE_RUN_SCRIPTS=" \
            --region=${{ env.REGION }} \
            --source=. \
            --memory=256MB \
            --timeout=60s \
            --quiet

      - name: Deploy Slots Fetcher Function
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud functions deploy slotsFetcher \
            --gen2 \
            --runtime=nodejs20 \
            --trigger-http \
            --allow-unauthenticated \
            --entry-point=slotsFetcher \
            --set-env-vars "GCS_BUCKET=${PROJECT_ID}-slots" \
            --set-build-env-vars "GOOGLE_NODE_RUN_SCRIPTS=" \
            --region=${{ env.REGION }} \
            --source=. \
            --memory=256MB \
            --timeout=120s \
            --quiet

      - name: Deploy Upload Coach Media Function
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          COACH_MEDIA_BUCKET: ${{ secrets.COACH_MEDIA_BUCKET }}
        run: |
          if [ -z "$COACH_MEDIA_BUCKET" ]; then
            echo "❌ Error: COACH_MEDIA_BUCKET secret is not set in GitHub Secrets"
            exit 1
          fi
          echo "✅ COACH_MEDIA_BUCKET is set: $COACH_MEDIA_BUCKET"
          gcloud functions deploy uploadCoachMedia \
            --gen2 \
            --runtime=nodejs20 \
            --trigger-http \
            --no-allow-unauthenticated \
            --entry-point=uploadCoachMedia \
            --set-env-vars "COACH_MEDIA_BUCKET=${COACH_MEDIA_BUCKET},BOT_TOKEN=${BOT_TOKEN},GOOGLE_CLOUD_PROJECT=${PROJECT_ID}" \
            --set-build-env-vars "GOOGLE_NODE_RUN_SCRIPTS=" \
            --region=${{ env.REGION }} \
            --source=. \
            --memory=256MB \
            --timeout=300s \
            --quiet

      - name: Grant Cloud Tasks permissions to uploadCoachMedia
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CLOUD_TASKS_QUEUE: ${{ secrets.CLOUD_TASKS_QUEUE }}
        run: |
          QUEUE_NAME=${CLOUD_TASKS_QUEUE:-media-upload-queue}
          # App Engine default service account (используется в OIDC токене)
          APP_ENGINE_SA="${PROJECT_ID}@appspot.gserviceaccount.com"
          echo "Project ID: ${PROJECT_ID}"
          echo "App Engine Service Account: ${APP_ENGINE_SA}"
          echo "Granting Cloud Run Invoker role to ${APP_ENGINE_SA} for uploadCoachMedia..."
          # Для gen2 функций используем Cloud Run команды
          if gcloud run services add-iam-policy-binding uploadCoachMedia \
            --region=${{ env.REGION }} \
            --member="serviceAccount:${APP_ENGINE_SA}" \
            --role="roles/run.invoker" \
            --platform=managed; then
            echo "✅ Permissions granted successfully to ${APP_ENGINE_SA}"
          else
            echo "⚠️ Warning: Could not grant permissions, trying to verify existing permissions..."
            # Проверяем текущие права
            gcloud run services get-iam-policy uploadCoachMedia \
              --region=${{ env.REGION }} \
              --platform=managed || echo "Could not get IAM policy"
          fi

      - name: Deploy Send Coach Reminder Function
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          USE_BIGQUERY: ${{ secrets.USE_BIGQUERY }}
          BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
          BIGQUERY_TABLE: ${{ secrets.BIGQUERY_TABLE }}
        run: |
          # Set the project explicitly to avoid conflicts
          gcloud config set project ${PROJECT_ID}
          
          # Wait for any in-progress operations on this function to complete
          echo "Checking for in-progress operations..."
          MAX_WAIT=300  # 5 minutes
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            IN_PROGRESS=$(gcloud functions operations list \
              --region=${{ env.REGION }} \
              --gen2 \
              --project=${PROJECT_ID} \
              --filter="metadata.target.name:sendCoachReminder AND done:false" \
              --format="value(name)" 2>/dev/null || echo "")
            if [ -z "$IN_PROGRESS" ]; then
              echo "No in-progress operations found"
              break
            fi
            echo "Waiting for in-progress operations to complete... (${ELAPSED}s)"
            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done
          
          ENV_VARS="BOT_TOKEN=${BOT_TOKEN},GOOGLE_CLOUD_PROJECT=${PROJECT_ID}"
          if [ -n "${USE_BIGQUERY}" ]; then
            ENV_VARS="${ENV_VARS},USE_BIGQUERY=${USE_BIGQUERY}"
          fi
          if [ -n "${BIGQUERY_DATASET}" ]; then
            ENV_VARS="${ENV_VARS},BIGQUERY_DATASET=${BIGQUERY_DATASET}"
          fi
          if [ -n "${BIGQUERY_TABLE}" ]; then
            ENV_VARS="${ENV_VARS},BIGQUERY_TABLE=${BIGQUERY_TABLE}"
          fi
          
          # Deploy with explicit project flag and retry on 409 errors
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            set +e  # Temporarily disable exit on error for retry logic
            gcloud functions deploy sendCoachReminder \
              --gen2 \
              --runtime=nodejs20 \
              --trigger-http \
              --no-allow-unauthenticated \
              --entry-point=sendCoachReminder \
              --set-env-vars "${ENV_VARS}" \
              --set-build-env-vars "GOOGLE_NODE_RUN_SCRIPTS=" \
              --region=${{ env.REGION }} \
              --project=${PROJECT_ID} \
              --source=. \
              --memory=256MB \
              --timeout=60s \
              --quiet
            EXIT_CODE=$?
            set -e  # Re-enable exit on error
            
            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ Deployment successful"
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⚠️ Deployment failed (exit code: $EXIT_CODE), retrying in 30 seconds... (attempt $RETRY_COUNT/$MAX_RETRIES)"
                sleep 30
              else
                echo "❌ Deployment failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Get Function URLs
        id: get-urls
        run: |
          BOT_URL=$(gcloud functions describe playTodayBot --region=${{ env.REGION }} --format='value(serviceConfig.uri)' 2>/dev/null)
          SLOTS_URL=$(gcloud functions describe slotsFetcher --region=${{ env.REGION }} --format='value(serviceConfig.uri)' 2>/dev/null)
          UPLOAD_MEDIA_URL=$(gcloud functions describe uploadCoachMedia --region=${{ env.REGION }} --format='value(serviceConfig.uri)' 2>/dev/null)
          REMINDER_URL=$(gcloud functions describe sendCoachReminder --region=${{ env.REGION }} --format='value(serviceConfig.uri)' 2>/dev/null)
          echo "bot_url=$BOT_URL" >> $GITHUB_OUTPUT
          echo "slots_url=$SLOTS_URL" >> $GITHUB_OUTPUT
          echo "upload_media_url=$UPLOAD_MEDIA_URL" >> $GITHUB_OUTPUT
          echo "reminder_url=$REMINDER_URL" >> $GITHUB_OUTPUT
          echo "✅ Telegram Bot URL: $BOT_URL"
          echo "✅ Slots Fetcher URL: $SLOTS_URL"
          echo "✅ Upload Coach Media URL: $UPLOAD_MEDIA_URL"
          echo "✅ Send Coach Reminder URL: $REMINDER_URL"

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Functions:" >> $GITHUB_STEP_SUMMARY
          echo "- **Telegram Bot**: ${{ steps.get-urls.outputs.bot_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Slots Fetcher**: ${{ steps.get-urls.outputs.slots_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Upload Coach Media**: ${{ steps.get-urls.outputs.upload_media_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Send Coach Reminder**: ${{ steps.get-urls.outputs.reminder_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Update Telegram webhook: \`curl -X POST \"https://api.telegram.org/bot\$BOT_TOKEN/setWebhook\" -d \"url=${{ steps.get-urls.outputs.bot_url }}\"\`" >> $GITHUB_STEP_SUMMARY

